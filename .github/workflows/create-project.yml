name: Create Android Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project Name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (e.g., com.example.app)'
        required: true
        default: 'com.example.myapp'
      target_repo:
        description: 'Target Repository Name'
        required: true
        default: 'my-android-app'
      app_description:
        description: 'App Description'
        required: false
        default: 'My Android Application'
      language:
        description: 'Programming Language'
        required: true
        default: 'kotlin'
        type: choice
        options:
          - kotlin
          - java
      gradle_dsl:
        description: 'Gradle DSL'
        required: true
        default: 'kts'
        type: choice
        options:
          - kts
          - groovy
      gradle_version:
        description: 'Gradle Version'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - stable
          - lts
      jdk_version:
        description: 'JDK Version'
        required: true
        default: '11'
        type: choice
        options:
          - '8'
          - '11'
          - '17'
          - '21'
      min_sdk:
        description: 'Minimum SDK Level'
        required: true
        default: '21'
      target_sdk:
        description: 'Target SDK Level'
        required: true
        default: '35'
      author:
        description: 'Author Name'
        required: false
        default: 'Developer'
      domain:
        description: 'Company Domain'
        required: false
        default: 'example.com'

jobs:
  create-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml jinja2 PyGithub
      
      - name: Run Project Generator
        env:
          INPUT_PROJECT_NAME: ${{ github.event.inputs.project_name }}
          INPUT_PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}
          INPUT_APP_DESCRIPTION: ${{ github.event.inputs.app_description }}
          INPUT_LANGUAGE: ${{ github.event.inputs.language }}
          INPUT_GRADLE_DSL: ${{ github.event.inputs.gradle_dsl }}
          INPUT_GRADLE_VERSION: ${{ github.event.inputs.gradle_version }}
          INPUT_JDK_VERSION: ${{ github.event.inputs.jdk_version }}
          INPUT_MIN_SDK: ${{ github.event.inputs.min_sdk }}
          INPUT_TARGET_SDK: ${{ github.event.inputs.target_sdk }}
          INPUT_AUTHOR: ${{ github.event.inputs.author }}
          INPUT_DOMAIN: ${{ github.event.inputs.domain }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd scripts
          python main.py
      
      - name: Create Success Comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Android Project Created Successfully!**\n\n' +
                    '- **Project**: ${{ github.event.inputs.project_name }}\n' +
                    '- **Package**: ${{ github.event.inputs.package_name }}\n' +
                    '- **Language**: ${{ github.event.inputs.language }}\n' +
                    '- **Min SDK**: ${{ github.event.inputs.min_sdk }}\n' +
                    '- **Target SDK**: ${{ github.event.inputs.target_sdk }}\n'
            })
      
      - name: Create Failure Comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Project Generation Failed**\n\nCheck the workflow logs for details.'
            })
