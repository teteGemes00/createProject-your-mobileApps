name: Lint & Format Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/**'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'scripts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          pip install flake8 pylint black isort
      
      - name: Run Black formatter check
        run: |
          black --check scripts/ || true
      
      - name: Run isort import check
        run: |
          isort --check-only scripts/ || true
      
      - name: Run Flake8 linter
        run: |
          flake8 scripts/ --max-line-length=120 --ignore=E203,W503 || true
      
      - name: Run Pylint
        run: |
          pylint scripts/ --disable=C0111,C0103 --fail-under=7.0 || true
      
      - name: Report lint results
        if: always()
        run: |
          echo "✅ Linting completed. Check logs for details."
